<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 28px; }
  .wrap { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .tiles { display: flex; gap: 6px; flex-wrap: wrap; }
  .lbl { font-family: var(--font-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-mid); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Tile, Board, ModeCard, PlayerTag } = window.BuscaminasDesignSystem_4d7cc5;
  const C = (state, value, owner) => ({ state, value: value || 0, owner: owner || null });
  const cells = [
    [C('revealed',1), C('revealed',2), C('flagged'), C('hidden'), C('hidden')],
    [C('revealed',0), C('revealed',3), C('revealed',2), C('revealed',1), C('hidden')],
    [C('revealed',0), C('revealed',0), C('revealed',1), C('exploded'), C('mine')],
    [C('hidden'), C('revealed',1), C('revealed',2,'p1'), C('revealed',5), C('revealed',8)],
  ];
  function Demo() {
    return (
      <div className="wrap">
        <div className="col">
          <div>
            <div className="lbl">Estados de celda</div>
            <div className="tiles">
              <Tile state="hidden" /><Tile state="flagged" /><Tile state="revealed" value={1} />
              <Tile state="revealed" value={3} /><Tile state="mine" /><Tile state="exploded" />
            </div>
          </div>
          <div>
            <div className="lbl">Tablero</div>
            <Board cells={cells} size="sm" />
          </div>
          <div>
            <div className="lbl">Jugadores</div>
            <PlayerTag name="Ana" slot="p1" ready />
            <div style={{height:8}}></div>
            <PlayerTag name="Beto" slot="p2" score={7} active />
          </div>
        </div>
        <div className="col">
          <ModeCard tone="cyan" title="Solitario" players="1" icon={<span style={{fontSize:24}}>✸</span>} subtitle="Despeja el campo a tu ritmo." />
          <ModeCard tone="lime" title="Cooperativo" players="2" icon={<span style={{fontSize:24}}>⚑</span>} subtitle="Un tablero, dos mentes." active />
          <ModeCard tone="magenta" title="Competitivo" players="2" icon={<span style={{fontSize:24}}>⚔</span>} subtitle="Mismo nivel, primero en ganar." />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
